[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safak-gorev2"
version = "0.1.0"
description = "ŞAFAK UAV ana ve hızlı Görev 2 uygulaması, kayıt ve salt okunur panel"
requires-python = ">=3.11"
dependencies = ["Flask>=2.2,<4", "waitress>=3.0,<4", "pymavlink>=2.4.49,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
desktop = ["opencv-python-headless==4.12.0.88", "numpy==2.2.6"]
test = ["pytest>=8.4,<9", "imageio-ffmpeg==0.6.0"]

[project.scripts]
safak-gorev2 = "safak_gorev2.competition.main:main"

[tool.setuptools.packages.find]
include = ["safak_gorev2*"]

[tool.setuptools.package-data]
safak_gorev2 = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
